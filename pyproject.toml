[project]
name = "session-herd"
version = "0.1.0"
description = "Herd your Claude Code and Codex sessions: one terminal tab per topic, handoffs instead of open loops, and an agent that runs the board."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "nightfade" }]
keywords = ["claude-code", "codex", "agents", "iterm2", "context-switching"]
dependencies = ["iterm2>=2.7"]

[project.urls]
Homepage = "https://github.com/nightfade/session-herd"

[project.scripts]
herd = "session_herd.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session_herd"]
